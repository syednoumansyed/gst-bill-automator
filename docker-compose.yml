services:
  gst-bill-automator:
    build:
      context: .
    image: gst-bill-automator:local
    container_name: gst-bill-automator
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GST_PORT:-3002}:3000"
    volumes:
      - ./config:/app/config
    env_file:
      - path: .env.local
        required: false
    # Override on Linux if ./config is owned by someone other than uid 1000
    user: "${GST_UID:-1000}:${GST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /app/.next/cache:mode=1777,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
